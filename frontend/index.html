<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geri bildirim paneli</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'], mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'] },
          colors: { ana: '#334155', anakoyu: '#1E293B', murekkep: '#232B38', gok: '#334155', zemin: '#F4F4F5' },
        },
      },
    };
  </script>
  <style>
    body { font-feature-settings: "tnum"; }
    textarea { field-sizing: content; }
    .sekme[aria-selected="true"] { border-color: #C8102E; color: #C8102E; }
    .sekme[aria-selected="false"] { border-color: transparent; color: #64748b; }
    .serit-hazirlaniyor { background-image: repeating-linear-gradient(45deg, #cbd5e1 0 6px, #e2e8f0 6px 12px); background-size: 17px 17px; }
    @media (prefers-reduced-motion: no-preference) {
      .serit-hazirlaniyor.akiyor { animation: kay 1s linear infinite; }
      @keyframes kay { to { background-position: 17px 0; } }
    }
  </style>
</head>
<body class="bg-zemin text-slate-800 font-sans antialiased min-h-screen">
  <header class="bg-ana text-white relative overflow-hidden">
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 pt-5 pb-24 flex flex-wrap items-center gap-4 justify-between">
      <div class="flex items-center gap-3">
        <div class="h-11 w-11 rounded-xl bg-white/10 ring-1 ring-white/20 grid place-items-center">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
          </svg>
        </div>
        <div>
          <p class="text-[11px] uppercase tracking-[0.2em] text-slate-300">İK paneli</p>
          <h1 class="text-xl sm:text-2xl font-semibold leading-tight">Geri bildirim paneli</h1>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div id="dosya-cip" class="hidden items-center gap-2 rounded-lg bg-white/10 ring-1 ring-white/15 px-3 py-2 text-sm">
          <svg viewBox="0 0 24 24" class="h-4 w-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
          </svg>
          <span id="dosya-adi" class="font-medium"></span>
          <span id="dosya-meta" class="text-slate-300"></span>
        </div>
        <label class="cursor-pointer inline-flex items-center gap-2 bg-white text-ana text-sm font-semibold px-4 py-2 rounded-lg hover:bg-slate-100 focus-within:ring-2 focus-within:ring-slate-300">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 16V4m0 0-4 4m4-4 4 4M4 20h16"/>
          </svg>
          <span id="yukle-etiket">ATS Excel dosyası yükle</span>
          <input id="dosya" type="file" accept=".xlsx" class="sr-only">
        </label>
      </div>
    </div>
  </header>

  <main class="relative max-w-7xl mx-auto px-4 sm:px-6 -mt-16 pb-10 space-y-6">
    <section id="bos" class="hidden bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-10 text-center">
      <h2 class="text-lg font-semibold">Başlamak için ATS Excel dosyasını yükleyin</h2>
      <p class="mt-2 text-sm text-slate-500 max-w-xl mx-auto">Panel bütün başvuruları okur, kayıtlı karara göre ayırıp sayar ve
        dayanağı sorunlu başvuruları e-posta üretmeden İK'ya ayırır. Veri değiştiğinde dosyayı yeniden yükleyin.</p>
    </section>

    <section id="ozet" class="hidden bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-5 sm:p-6"></section>

    <nav id="sekmeler" class="hidden flex gap-1 border-b border-slate-200">
      <button data-sekme="basvurular" class="sekme px-4 py-2 text-sm font-medium border-b-2 -mb-px">Başvurular</button>
      <button data-sekme="ik" class="sekme px-4 py-2 text-sm font-medium border-b-2 -mb-px">İK incelemesi</button>
      <button data-sekme="isyuku" class="sekme px-4 py-2 text-sm font-medium border-b-2 -mb-px">İş yükü</button>
    </nav>

    <section id="icerik"></section>
  </main>

  <div id="cekmece" class="hidden fixed inset-0 z-40">
    <div id="perde" class="absolute inset-0 bg-slate-900/40"></div>
    <aside class="absolute right-0 top-0 h-full w-full max-w-6xl bg-zemin shadow-2xl overflow-y-auto">
      <div id="detay"></div>
    </aside>
  </div>

  <div id="bildirim" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-lg text-sm shadow-lg max-w-lg"></div>

  <script src="app.js"></script>
</body>
</html>
